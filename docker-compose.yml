# Ha tang phat trien: PostgreSQL + Redis + MinIO
# Chay: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: nhavuon-postgres
    environment:
      POSTGRES_USER: nhavuon
      POSTGRES_PASSWORD: nhavuon_secret
      POSTGRES_DB: nhavuon_sonla
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhavuon -d nhavuon_sonla"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nhavuon-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: nhavuon-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
